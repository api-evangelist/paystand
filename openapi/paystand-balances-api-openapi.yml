info:
  title: Sandbox Secure Balances API
  version: 3.2.1
servers:
- url: https://api.paystand.co/v3
security:
- sec0: []
  sec1: []
  sec2: []
  sec3: []
tags:
- name: Balances
paths:
  /balances/accounts:
    post:
      summary: Create an account
      description: ''
      operationId: create-an-account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - key
              properties:
                name:
                  type: string
                  description: The name of the account
                  default: California Funds Account
                key:
                  type: string
                  description: A key for the account.
                  default: california_account
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\":\"h3qo5rine8itrr43wfen2356\",\n  \"object\":\"balanceAccount\",\n  \"name\": \"California Funds Account\",\n  \"key\": \"california_account\",\n  \"status\": \"active\",\n  \"created\": \"2015-10-28T22:55:09.000Z\",\n  \"lastUpdated\": \"2015-10-28T22:55:13.000Z\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: h3qo5rine8itrr43wfen2356
                  object:
                    type: string
                    example: balanceAccount
                  name:
                    type: string
                    example: California Funds Account
                  key:
                    type: string
                    example: california_account
                  status:
                    type: string
                    example: active
                  created:
                    type: string
                    example: '2015-10-28T22:55:09.000Z'
                  lastUpdated:
                    type: string
                    example: '2015-10-28T22:55:13.000Z'
      deprecated: false
      tags:
      - Balances
  /balances/summary:
    get:
      summary: Retrieve the balances
      description: ''
      operationId: balance-summary
      parameters:
      - name: accounts
        in: query
        description: List of accounts to show. [default, your_key]
        schema:
          type: string
          default: default
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"usd\": {\n    \"default\": {\n      \"available\": \"20.00\",\n      \"pending\": \"80.00\",\n      \"current\": \"100.00\"\n    },\n    \"california_funds\": {\n      \"available\": \"10.00\",\n      \"pending\": \"0.00\",\n      \"current\": \"10.00\" \n    }\n  }\n}"
              schema:
                type: object
                properties:
                  usd:
                    type: object
                    properties:
                      default:
                        type: object
                        properties:
                          available:
                            type: string
                            example: '20.00'
                          pending:
                            type: string
                            example: '80.00'
                          current:
                            type: string
                            example: '100.00'
                      california_funds:
                        type: object
                        properties:
                          available:
                            type: string
                            example: '10.00'
                          pending:
                            type: string
                            example: '0.00'
                          current:
                            type: string
                            example: '10.00'
      deprecated: false
      tags:
      - Balances
components:
  securitySchemes:
    sec0:
