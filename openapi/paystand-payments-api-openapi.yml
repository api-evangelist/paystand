  /payments/secure:
    post:
      summary: Create a payment
      description: 'One of `payerId` or `payer` values are required in the request, but not both.

        Only one of `bank`, `cardId`, `bankId`, or `tokenId` are required in the request.

        The `accountKey` field defaults to the customer''s default account.'
      operationId: create-payment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - currency
              - cardId
              - bankId
              - bank
              - payerId
              - payer
              properties:
                amount:
                  type: string
                  description: The amount of the payment
                  default: '5000.00'
                currency:
                  type: string
                  description: The currency of the payment
                  default: USD
                cardId:
                  type: string
                  description: The card object to use for the card payment
                bankId:
                  type: string
                bank:
                  type: object
                  description: The bank object to use for the bank payment
                  properties:
                    nameOnAccount:
                      type: string
                      default: Jessica Lin
                    accountHolderType:
                      type: string
                      default: company
                    accountNumber:
                      type: string
                      default: 000123456789
                    routingNumber:
                      type: string
                      default: '110000000'
                    accountType:
                      type: string
                      description: checking, savings
                      default: checking
                    country:
                      type: string
                      default: USA
                    currency:
                      type: string
                      default: USD
                payerId:
                  type: string
                  description: The id of the payer to assign to the card.
                payer:
                  type: object
                  description: A payer object to create and assign to the card.
                  properties:
                    name:
                      type: string
                      default: Shalin Shaun
                    email:
                      type: string
                      default: shalin+test@paystand.com
                    address:
                      type: object
                      properties:
                        street1:
                          type: string
                          default: 123 First St
                        street2:
                          type: string
                          default: '#2'
                        city:
                          type: string
                          default: Santa Cruz
                        state:
                          type: string
                          default: CA
                        postalCode:
                          type: string
                          default: '95060'
                        country:
                          type: string
                          default: USA
                accountKey:
                  type: string
                  description: The key of the account to send the funds to
                meta:
                  type: string
                  description: Optional key/values to help link the card payment to an external system.
                  format: json
                description:
                  type: string
                  description: A short description of the payment.
      responses:
        '200':
          description: '200'
          content:
