notes: >-
  Paystand documents a single canonical error object shape (see envelope) rather
  than a per-status catalogue. The HTTP status is carried in error.status and a
  machine code in error.details.code (e.g. validationError). Card/bank payment
  failures surface as decline reasons — see errors/paystand-decline-codes.yml.
