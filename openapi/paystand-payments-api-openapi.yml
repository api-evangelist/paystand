openapi: 3.2.0
info:
  title: Sandbox Secure Payments API
  version: 3.2.1
servers:
- url: https://api.paystand.co/v3
security:
- sec0: []
  sec1: []
  sec2: []
  sec3: []
tags:
- name: Payments
paths:
  /payments/all:
    get:
      summary: List all payments
      description: Returns a list of all payments you’ve previously created. The payments are returned in sorted order, with the most recent refunds appearing first. For convenience, pagination is available with the limit and offset parameters.
      operationId: get-all-payments
      parameters:
      - name: startDate
        in: query
        description: Filters the list based on the object "created" field, will return records whose created date is greater than or equal to the startDate.
        schema:
          type: string
          format: date
          default: '2014-01-01'
      - name: endDate
        in: query
        description: Filters the list based on the object "created" field, will return records whose created date is less than or equal to the endDate.
        schema:
          type: string
          format: date
          default: '2020-02-02'
      - name: format
        in: query
        description: 'Defines how data should be return, accepted values: ["json", "csv"]'
        schema:
          type: string
          default: json
      - name: offset
        in: query
        description: Use for pagination, how many records should the query skip
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Defines how many values should it return, accepted value range between 1 and 200
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{ \n   \"results\":[ \n      { \n         \"object\":\"payment\",\n         \"id\":\"rurl2jp2p31djxm6tg8f7ezh\",\n         \"amount\":\"5000.00\",\n         \"currency\":\"USD\",\n         \"settlementAmount\":\"5000.00\",\n         \"settlementCurrency\":\"USD\",\n         \"externalId\":\"pay01\",\n         \"sourceId\":\"6whpaa24mz35khmwec931l3i\",\n         \"sourceType\":\"Bank\",\n         \"datePosted\":\"2019-07-11T14:05:48.000Z\",\n         \"status\":\"posted\",\n         \"ownerId\":\"yxfxbcl6jjtjk57zv7t97i01\",\n         \"created\":\"2019-07-11T14:05:47.000Z\",\n         \"lastUpdated\":\"2019-07-11T14:05:48.000Z\",\n         \"payerId\":\"o62bdcp9dzdelc2bcudsru9l\",\n         \"payer\":{ \n            \"object\":\"payer\",\n            \"id\":\"o62bdcp9dzdelc2bcudsru9l\",\n            \"name\":\"Christina C\",\n            \"email\":\"cchen+test@paystand.com\",\n            \"address\":{ \n               \"object\":\"address\",\n               \"id\":\"wfhem0iqzhvij7u3ulalq1xk\",\n               \"street1\":\"41 Grandview St Unit C\",\n               \"city\":\"Santa Cruz\",\n               \"state\":\"CA\",\n               \"postalCode\":\"95060\",\n               \"country\":\"USA\",\n               \"status\":\"active\",\n               \"created\":\"2019-07-11T14:00:49.000Z\",\n               \"lastUpdated\":\"2019-07-11T14:00:50.000Z\"\n            },\n            \"ownerId\":\"yxfxbcl6jjtjk57zv7t97i01\",\n            \"status\":\"active\",\n            \"created\":\"2019-07-11T14:00:49.000Z\",\n            \"lastUpdated\":\"2019-07-11T14:00:50.000Z\"\n         },\n         \"source\":{ \n            \"object\":\"bank\",\n            \"id\":\"6whpaa24mz35khmwec931l3i\",\n            \"accountType\":\"checking\",\n            \"bankName\":\"PayStand Test Bank\",\n            \"routingNumber\":\"110000000\",\n            \"nameOnAccount\":\"Jessica Lin\",\n            \"accountHolderType\":\"individual\",\n            \"currency\":\"USD\",\n            \"country\":\"USA\",\n            \"last4\":\"6789\",\n            \"fingerprint\":\"4cpw32i0hoz5iyhx7la194cy\",\n            \"isDefault\":true,\n            \"isApDefault\":false,\n            \"payerId\":\"o62bdcp9dzdelc2bcudsru9l\",\n            \"billingAddress\":{ \n               \"object\":\"address\",\n               \"id\":\"pqb96kvax0f6m98x7nsxtrqy\",\n               \"street1\":\"payer street\",\n               \"city\":\"payer city\",\n               \"state\":\"CA\",\n               \"postalCode\":\"95060\",\n               \"country\":\"USA\",\n               \"status\":\"active\",\n               \"created\":\"2019-07-11T14:00:49.000Z\",\n               \"lastUpdated\":\"2019-07-11T14:00:50.000Z\"\n            },\n            \"externalId\":\"bank_001\",\n            \"dropped\":false,\n            \"verified\":false,\n            \"status\":\"active\",\n            \"created\":\"2019-07-11T14:00:49.000Z\",\n            \"lastUpdated\":\"2019-07-11T14:00:50.000Z\"\n         },\n         \"holds\":[ \n            { \n               \"object\":\"hold\",\n               \"id\":\"d2ha1b1r5mnrmt2pec63scy7\",\n               \"amount\":\"5000.00\",\n               \"currency\":\"USD\",\n               \"holdTime\":\"0\",\n               \"releaseDate\":\"2019-07-11T14:05:47.000Z\",\n               \"resourceId\":\"rurl2jp2p31djxm6tg8f7ezh\",\n               \"resourceType\":\"Payment\",\n               \"status\":\"active\",\n               \"created\":\"2019-07-11T14:05:47.000Z\",\n               \"lastUpdated\":\"2019-07-11T14:05:50.000Z\"\n            }\n         ],\n         \"customValues\":[ \n            { \n               \"object\":\"customValue\",\n               \"id\":\"883oomcc7le9qg0oh0srqp24\",\n               \"fieldValue\":\"Paystand\",\n               \"customField\":{ \n                  \"id\":\"iu2ogmdxfiucld9lycdwjul1\",\n                  \"fieldName\":\"What is you name\",\n                  \"fieldKey\