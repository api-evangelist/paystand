paths:
  /payers:
    post:
      summary: Create a payer
      description: ''
      operationId: create-a-payer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              properties:
                name:
                  type: string
                  description: The name of the payer
                  default: Christina C
                email:
                  type: string
                  description: The email of the payer
                  default: christinac@paystand.com
                address:
                  type: object
                  description: The address for the payer.
                  properties:
                    street1:
                      type: string
                      default: 123 First St
                    street2:
                      type: string
                      default: '#2'
                    city:
                      type: string
                      default: Santa Cruz
                    state:
                      type: string
                      default: CA
                    postalCode:
                      type: string
                      default: '95060'
                    country:
                      type: string
                      default: USA
                meta:
                  type: string
                  description: Optional key/values to help link a payer to an external system.
                  default: '{}'
                  format: json
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"577b2ada121841e08b429444\",\n  \"object\": \"payer\",\n  \"name\": \"Christina C\",\n  \"email\": \"christinac@paystand.com\",\n  \"address\": {\n    \"id\": \"905b3a4c929c4d958092dce2\",\n    \"object\": \"address\",\n    \"street1\": \"41 Grandview St Unit C\",\n    \"city\": \"Santa Cruz\",\n    \"state\": \"CA\",\n    \"postalCode\": \"95060\",\n    \"country\": \"USA\",\n    \"status\": \"active\",\n    \"created\": \"2018-08-07T20:07:14.000Z\",\n    \"lastUpdated\": \"2018-08-07T20:07:14.000Z\"\n  },\n  \"status\": \"active\",\n  \"created\": \"2018-08-07T20:07:14.000Z\",\n  \"lastUpdated\": \"2018-08-07T20:07:14.000Z\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 577b2ada121841e08b429444
                  object:
                    type: string
                    example: payer
                  name:
                    type: string
                    example: Christina C
                  email:
                    type: string
                    example: christinac@paystand.com
                  address:
                    type: object
                    properties:
                      id:
                        type: string
