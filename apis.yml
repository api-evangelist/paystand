aid: paystand
name: PayStand
description: >-
  Paystand is a blockchain-enabled B2B payments and receivables automation
  platform that lets businesses send, receive, and reconcile payments with
  zero-fee bank-to-bank (ACH/EFT) transfers, card acceptance, and a
  Bitcoin-anchored "Assurety" certified audit trail. The Paystand Developer API
  (v3) exposes payments, refunds, disputes, payers, customer banks, accounts and
  balances, scheduled payments, transfers, withdrawals (including auto-withdrawal
  settings), a Checkout / Billing Portal embed surface, an Events resource, and
  the Assurety blockchain notarization APIs (assurors, chains, contracts,
  records, schemas, wallets). It integrates with major ERPs and e-commerce
  platforms (Magento, WooCommerce, BigCommerce) and is used to automate accounts
  receivable and payable for mid-market and enterprise finance teams.
