openapi: 3.2.0
info:
  title: Sandbox Secure Banks API
  version: 3.2.1
servers:
- url: https://api.paystand.co/v3
security:
- sec0: []
  sec1: []
  sec2: []
  sec3: []
tags:
- name: Banks
paths:
  /banks:
    post:
      summary: Create a bank
      operationId: create-bank
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - nameOnAccount
              - accountType
              - accountHolderType
              - accountNumber
              - routingNumber
              - currency
              - country
              - billingAddress
              properties:
                nameOnAccount:
                  type: string
                  description: The name on the account.
                  default: Jessica Lin
                accountType:
                  type: string
                  description: The account type of the bank [checking, saving]
                  default: checking
                accountHolderType:
                  type: string
                  description: The account holder type for the bank. [company, individual]
                  default: company
                accountNumber:
                  type: string
                  description: The account number of the bank.
                  default: 000123456789
                routingNumber:
                  type: string
                  description: The routing number of the bank.
                  default: '110000000'
                currency:
                  type: string
                  description: The currency of the bank account.
                  default: USD
                country:
                  type: string
                  description: The country of the bank account.
                  default: USA
                billingAddress:
                  type: object
                  description: The billing address of the bank account.
                  properties:
                    street1:
                      type: string
                      default: 123 First St
                    street2:
                      type: string
                      default: '#2'
                    city:
                      type: string
                      default: Santa Cruz
                    state:
                      type: string
                      default: CA
                    postalCode:
                      type: string
                      default: '95060'
                    country:
                      type: string
                      default: USA
                meta:
                  type: string
                  description: Optional key/values to help link the bank to an external system.
                  default: '{}'
                  format: json
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"object\": \"bank\",\n  \"id\": \"kav410bdsww9nat8gafwrb\",\n  \"accountType\": \"checking\",\n  \"routingNumber\": \"110000000\",\n  \"nameOnAccount\": \"Jessica Lin\",\n  \"currency\": \"USD\",\n  \"country\": \"USA\",\n  \"last4\": \"6789\",\n  \"fingerprint\": \"lv5rz4qvndasdaasd34v62u2d2y\",\n  \"billingAddress\": {\n    \"street1\": \"923 test account st\",\n    \"street2\": \"9g\",\n    \"city\": \"santa cruz\",\n    \"state\": \"CA\",\n    \"postalCode\": \"90040\",\n    \"country\": \"USA\"\n  },\n  \"dropped\": false,\n  \"verified\": false,\n  \"status\": \"active\",\n  \"created\": \"2015-10-28T22:56:20.000Z\",\n  \"lastUpdated\": \"2015-10-28T24:56:20.000Z\"\n}"
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: bank
                  id:
                    type: string
                    example: kav410bdsww9nat8gafwrb
                  accountType:
                    type: string
                    example: checking
                  routingNumber:
                    type: string
                    example: '110000000'
                  nameOnAccount:
                    type: string
                    example: Jessica Lin
                  currency:
                    type: string
                    example: USD
                  country:
                    type: string
                    example: USA
                  last4:
                    type: string
                    example: '6789'
                  fingerprint:
                    type: string
                    example: lv5rz4qvndasdaasd34v62u2d2y
                  billingAddress:
                    type: object
                    properties:
                      street1:
                        type: string
                        example: 923 test account st
                      street2:
                        type: string
                        example: 9g
                      city:
                        type: string
                        example: santa cruz
                      state:
                        type: string
                        example: CA
                      postalCode:
                        type: string
                        example: '90040'
                      country:
                        type: string
                        example: USA
                  dropped:
                    type: boolean
                    example: false
                    default: true
                  verified:
                    type: boolean
                    example: false
                    default: true
                  status:
                    type: string
                    example: active
                  created:
                    type: string
                    example: '2015-10-28T22:56:20.000Z'
                  lastUpdated:
                    type: string
                    example: '2015-10-28T24:56:20.000Z'
      deprecated: false
      tags:
      - Banks
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: header
      name: X-CUSTOMER-ID
      x-default: axjf9rjo9o6ojp5kcya7vle0
    sec1:
      type: apiKey
      in: header
      name: Authorization
      x-bearer-format: bearer
      x-default: zGwAN7EfU9HYsGlcIQGGBKZ75Xug1Zdy
    sec2:
      type: apiKey
      in: header
      name: Accept
      x-default: application/json
    sec3:
      type: apiKey
      in: header
      name: Content-Type
      x-default: application/json
